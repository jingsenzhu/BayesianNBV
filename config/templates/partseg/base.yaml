# Base config template for part segmentation (PointNet++ on ShapeNet).
# Usage: python experiments/main_partseg.py <exp_dir> <this file> <partseg.yaml> ...
# The driver loads this file, then does a shallow `config.update(task_yaml)`, so the task file
# replaces whole top-level sections (here: `camera` and `partseg`).

points:
  subsample_points: 2048   # points kept (FPS) when the task model is evaluated on the accumulated scan
  scan_batch_size: 120     # candidate views rasterized per batch during sphere search (lower it if out of memory)
  max_points: 8192         # the accumulated scan is FPS-subsampled to this size before SPSR

scan:
  resolution: [64, 64]             # depth image [H, W]
  fov: 30                          # camera field of view (degrees)
  mesh_normalization_radius: 2.5   # the mesh is normalized to a sphere of this radius

camera: null  # defined in the task config

spsr:
  noise_level: 0.01          # std of the noise added to scanned points and normals
  amortization_density: 50   # grid resolution of the amortized cross-covariance interpolator
  num_samples: null          # posterior samples per step; null = rows in <precompute_dir>/000.npy. Otherwise a multiple of it.
  num_ray_samples: 100       # points per ray; only read by `--exp_type uncertainty`
  batch_size: 6400           # evaluation batch size for the SPSR mean on the grid
  # grid_density, grid_radius, truncation_n, lengthscale and variance are NOT set here.
  # They are read from <exp.precompute_dir>/config.json (see scripts/precompute_f_samples.py).

exp:
  precompute_dir: precompute/l_5e-3_v_0.2   # prior f samples, needs >= (num_steps - 1) * (num_samples / rows per file) files
  step_reconstruction: false   # keep false: `true` crashes in BaseRunner.run (the call omits `step_ckpt`)
  acquisition: null            # unused: the part segmentation utility is fixed
  num_steps: 6                 # total views, including the initial one
